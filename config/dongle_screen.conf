# YADS (zmk-dongle-screen) user config for the dongle.
# Applied automatically when building with the `dongle_screen` shield.

# Fixed brightness, no ambient light sensor.
CONFIG_DONGLE_SCREEN_AMBIENT_LIGHT=n
CONFIG_DONGLE_SCREEN_DEFAULT_BRIGHTNESS=40

# Keep brightness/toggle control disabled unless you explicitly map the
# corresponding F22/F23/F24 keycodes in your keymap.
CONFIG_DONGLE_SCREEN_BRIGHTNESS_KEYBOARD_CONTROL=n
